[package]
name = "trace-lsp"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "High-performance Language Server Protocol (LSP) for EVM and Foundry execution traces"
repository = "https://github.com/BBHGuild/trace-lsp"

[dependencies]
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
